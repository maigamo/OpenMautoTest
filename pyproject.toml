[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmautotest"
version = "1.0.0"
description = "OpenMautoTest - 跨端自动化测试平台"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "OpenMautoTest Team", email = "team@openmautotest.com"}
]
keywords = ["automation", "testing", "cross-platform", "web", "miniprogram"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance"
]
requires-python = ">=3.8"
dependencies = [
    "pytest>=7.4.0",
    "playwright>=1.37.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.11.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "structlog>=23.1.0",
    "allure-pytest>=2.13.0"
]

[project.optional-dependencies]
dev = [
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "pytest-cov>=4.1.0"
]
async = [
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "aiohttp>=3.8.0"
]
database = [
    "psycopg2-binary>=2.9.0",
    "pymongo>=4.4.0",
    "redis>=4.6.0"
]
reporting = [
    "jinja2>=3.1.0",
    "matplotlib>=3.7.0",
    "plotly>=5.15.0"
]

[project.urls]
Homepage = "https://github.com/openmautotest/openmautotest"
Documentation = "https://docs.openmautotest.com"
Repository = "https://github.com/openmautotest/openmautotest"
Issues = "https://github.com/openmautotest/openmautotest/issues"

[project.scripts]
openmautotest = "openmautotest.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "configs*", "db*", "drivers*", "flows*", "orchestrator*", "llm*"]
exclude = ["tests*", "output*", "docs*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--alluredir=output/allure-results"
]
testpaths = ["tests", "flows"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "web: marks tests as web automation tests",
    "mini: marks tests as mini-program automation tests",
    "api: marks tests as API tests",
    "smoke: marks tests as smoke tests",
    "regression: marks tests as regression tests",
    "parametrized: marks tests as parametrized tests",
    "web_flow: marks tests as web flow tests",
    "mini_flow: marks tests as mini flow tests",
    "api_flow: marks tests as api flow tests"
]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | output
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
src_paths = ["common", "configs", "db", "drivers", "flows", "orchestrator", "llm"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "minium.*",
    "allure.*",
    "playwright.*"
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["common", "configs", "db", "drivers", "orchestrator", "llm"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]
